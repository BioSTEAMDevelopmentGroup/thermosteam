# This workflow will install Python dependencies, run tests with a variety of Python versions

name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements_test.txt', 'setup.py') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pip-

    - name: Install Graphviz
      # Optional: graphviz tests are skipped when the `dot` executable is missing.
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install dependencies
      env:
        # On a pull request this is the PR's source branch; on a push it is the pushed branch.
        BRANCH: ${{ github.head_ref || github.ref_name }}
        # Owner of the repository the PR comes from (differs from the upstream org for PRs from forks).
        HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
      run: |
        # Return a pip-installable git URL for a BioSTEAM repository. If a branch with the same
        # name as this branch exists there (first in the PR author's fork, then upstream),
        # use that branch; otherwise use the default branch.
        repo_url() {
          local owner=$1 repo=$2 candidate
          for candidate in "$HEAD_OWNER/$repo" "$owner/$repo"; do
            if git ls-remote --exit-code --heads "https://github.com/$candidate.git" "$BRANCH" > /dev/null 2>&1; then
              echo "Using branch '$BRANCH' of $candidate" >&2
              echo "git+https://github.com/$candidate.git@$BRANCH"
              return
            fi
          done
          echo "No branch '$BRANCH' in $repo; using default branch of $owner/$repo" >&2
          echo "git+https://github.com/$owner/$repo.git"
        }
        python -c "import platform; print(platform.platform()); print(platform.architecture())"
        python -m pip install --upgrade pip
        python -m pip install wheel
        pip install --no-cache-dir git+https://github.com/CalebBell/fluids.git
        pip install --no-cache-dir git+https://github.com/CalebBell/chemicals.git
        pip install --no-cache-dir git+https://github.com/CalebBell/thermo.git
        pip install -r requirements_test.txt
        pip install --no-cache-dir "$(repo_url BioSTEAMDevelopmentGroup biosteam)"
        pip install --no-cache-dir "$(repo_url BioSTEAMDevelopmentGroup Bioindustrial-Park)"
        pip uninstall thermosteam -y
        pip install -e .
    - name: Test without numba
      run: |
        pytest . -v --disable-numba=1 --cov-report html --cov=thermosteam --cov-report term-missing -m "not slow"
      env:
            COVERALLS_REPO_TOKEN: ${{ secrets.coveralls }}
            COVERALLS_PARALLEL: true
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      run: |
        curl https://coveralls.io/webhook?repo_token=${{ secrets.coveralls }} -d "payload[build_num]=${{ github.sha }}&payload[status]=done"
